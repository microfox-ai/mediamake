name: Private content guard

# Unreleased MCPs and apps belong in the gitignored private/ folder and in
# private storage, never in this public repository. Skills are all public, so
# they are only checked for keys and machine paths.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No files committed under private/
        run: |
          leaked=$(git ls-files private | grep -v '^private/README.md$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::These files are under private/ and must not be committed:"
            echo "$leaked"
            echo "Remove them with: git rm --cached <file>"
            exit 1
          fi
          echo "private/ holds only its README."
      - name: No keys or machine paths in skills, SKILLS.md up to date
        # Every skill is public; tools/skills.mjs fails on keys, tokens and /Users/… paths
        run: node tools/skills.mjs check
