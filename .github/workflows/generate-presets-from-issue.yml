name: Generate Presets from Issue

on:
  issues:
    types: [opened]

jobs:
  process-preset-requests:
    # Only run if issue title starts with "New Presets" (case variations)
    if: |
      startsWith(github.event.issue.title, 'New Presets') ||
      startsWith(github.event.issue.title, 'new presets') ||
      startsWith(github.event.issue.title, 'NEW PRESETS') ||
      startsWith(github.event.issue.title, 'New presets') ||
      startsWith(github.event.issue.title, 'new Presets')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # working-directory: apps/mediamake
        run: npm i

      - name: Apply Next.js requestTimeout patch
        run: |
          npx patch-package
          echo "✅ Applied Next.js patch for extended requestTimeout (1 hour)"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Variables
        working-directory: apps/mediamake
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel env pull --environment=production --token=${{ secrets.VERCEL_TOKEN }} .env
          echo "✅ Environment variables pulled"

      - name: Build MediaMake App
        # working-directory: apps/mediamake
        run: |
          npm run build
          echo "✅ Build complete"

      - name: Start MediaMake Server (with patched requestTimeout)
        working-directory: apps/mediamake
        run: |
          npm run start > server.log 2>&1 &
          SERVER_PID=$!
          echo "🚀 Server starting in background (PID: $SERVER_PID)..."
          
          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server responded to root endpoint!"
              
              # Additional check - see if server process is still running
              if ps -p $SERVER_PID > /dev/null; then
                echo "✅ Server process is running (PID: $SERVER_PID)"
              else
                echo "⚠️  Server process not found - it may have crashed"
                echo "Last 50 lines of server log:"
                tail -n 50 server.log
              fi
              
              # Give server a few more seconds to fully initialize
              echo "⏳ Waiting 5 more seconds for full initialization..."
              sleep 5
              echo "✅ Server is ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          echo "❌ Server failed to start within 2 minutes"
          echo "Server log:"
          cat server.log
          exit 1

      - name: Parse and process preset requests
        id: process
        working-directory: apps/mediamake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: http://localhost:3000
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          async function processPresets() {
            try {
              const issueBody = process.env.ISSUE_BODY;
              const issueNumber = process.env.ISSUE_NUMBER;
              const issueTitle = process.env.ISSUE_TITLE;
              const apiBaseUrl = process.env.API_BASE_URL;
              const devApiKey = process.env.DEV_API_KEY;
              
              // Validate issue title (case-insensitive prefix check)
              if (!issueTitle || !issueTitle.toLowerCase().startsWith('new presets')) {
                console.log('⏭️  Skipping: Issue title does not start with "new presets" (case-insensitive)');
                process.exit(0);
              }
              
              console.log('✅ Issue title validated');
              console.log('📋 Parsing issue body as JSON...');
              
              // Parse the issue body - need to extract JSON from GitHub's markdown formatting
              let presetRequests;
              try {
                let jsonString = issueBody.trim();
                console.log('📄 Raw issue body preview:', jsonString.substring(0, 150).replace(/\n/g, ' ') + '...');
                console.log('📏 Body length:', jsonString.length, 'characters');
                
                // GitHub issue templates wrap content with markdown headers
                // Extract just the JSON array part
                // Look for the first '[' and last ']' to extract the JSON array
                const firstBracket = jsonString.indexOf('[');
                const lastBracket = jsonString.lastIndexOf(']');
                
                if (firstBracket === -1 || lastBracket === -1 || firstBracket >= lastBracket) {
                  throw new Error('Could not find JSON array in issue body (missing [ or ])');
                }
                
                // Extract the JSON portion
                jsonString = jsonString.substring(firstBracket, lastBracket + 1);
                console.log('📄 Extracted JSON preview:', jsonString.substring(0, 150).replace(/\n/g, ' ') + '...');
                
                presetRequests = JSON.parse(jsonString);
                
                if (!Array.isArray(presetRequests)) {
                  console.error('❌ Parsed content is not a JSON array');
                  console.error('Received type:', typeof presetRequests);
                  process.exit(1);
                }
                
                console.log('✅ Successfully parsed', presetRequests.length, 'preset request(s)');
              } catch (error) {
                console.error('❌ Failed to parse issue body as JSON:', error.message);
                console.error('Issue body preview:', issueBody.substring(0, 300));
                console.error('');
                console.error('💡 Tip: Make sure your issue contains a valid JSON array.');
                console.error('   Format: [{"prompt": "...", "technicalSpecs": "..."}]');
                console.error('   Validate at: https://jsonlint.com');
                process.exit(1);
              }

              if (!Array.isArray(presetRequests)) {
                console.error('❌ Issue body is not an array');
                process.exit(1);
              }

              console.log(`✅ Found ${presetRequests.length} preset request(s)`);
              console.log(`📦 Will process in batches of 3 to avoid server overload`);

              // Configure git
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

              // Start timing
              const startTime = Date.now();

              // ==========================================
              // STEP 1: CREATE PR AND BRANCH FIRST
              // ==========================================
              console.log('\n🌿 Step 1: Creating branch and PR first (for progressive commits)...');
              const step1Start = Date.now();
              
              // Configure git
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              
              // Change to repo root for git operations
              const currentDir = process.cwd();
              const repoRoot = path.resolve(currentDir, '..', '..');
              console.log(`📁 Current dir: ${currentDir}`);
              console.log(`📁 Changing to repo root: ${repoRoot}`);
              process.chdir(repoRoot);
              console.log(`📁 Now in: ${process.cwd()}`);
              
              // Create branch
              const timestamp = Date.now();
              const branchName = `presets/batch-${issueNumber}-${timestamp}`;
              console.log(`🌿 Creating branch: ${branchName}`);
              execSync(`git checkout -b ${branchName}`);
              
              // Extract descriptive title from issue title
              let descriptiveTitle = 'Preset Request';
              if (issueTitle) {
                const match = issueTitle.match(/new\s+presets?\s*[-:]\s*(.+)/i);
                if (match && match[1]) {
                  descriptiveTitle = match[1].trim();
                } else {
                  const simpleMatch = issueTitle.match(/new\s+presets?\s+(.+)/i);
                  if (simpleMatch && simpleMatch[1]) {
                    descriptiveTitle = simpleMatch[1].trim();
                  }
                }
              }
              
              // Create initial PR
              const presetCount = presetRequests.length;
              const presetWord = presetCount === 1 ? 'preset' : 'presets';
              const prTitle = `add ${presetCount} ${presetWord} from issue #${issueNumber} - ${descriptiveTitle}`;
              
              let initialPrBody = `This PR was automatically generated from issue #${issueNumber}\n\n`;
              initialPrBody += `## 🚀 Generation In Progress\n\n`;
              initialPrBody += `Generating ${presetCount} preset(s)...\n\n`;
              initialPrBody += `**Status:** Starting generation process\n\n`;
              initialPrBody += `_This PR will be updated as each preset is generated and committed._\n\n`;
              initialPrBody += `Closes #${issueNumber}`;
              
              console.log(`📝 Creating initial PR: ${prTitle}`);
              
              let prUrl = null;
              let prNumber = null;
              
              try {
                // Create empty initial commit
                execSync('git commit --allow-empty -m "chore: initialize preset generation"');
                execSync(`git push -u origin ${branchName}`);
                
                const prResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls`, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json',
                  },
                  body: JSON.stringify({
                    title: prTitle,
                    body: initialPrBody,
                    head: branchName,
                    base: 'main',
                  }),
                });

                if (!prResponse.ok) {
                  const prError = await prResponse.text();
                  throw new Error(`Failed to create PR: ${prResponse.status} ${prError}`);
                }

                const prData = await prResponse.json();
                prUrl = prData.html_url;
                prNumber = prData.number;
                
                console.log(`✅ PR created: ${prUrl}`);
              } catch (error) {
                console.error(`❌ Failed to create PR:`, error.message);
                process.exit(1);
              }
              
              const step1Duration = ((Date.now() - step1Start) / 1000).toFixed(2);
              console.log(`\n✅ Branch and PR created (${step1Duration}s)`);

              // ==========================================
              // STEP 2: GENERATE AND COMMIT PRESETS ONE BY ONE
              // ==========================================
              console.log('\n🚀 Step 2: Generating presets one by one with immediate commits...');
              const step2Start = Date.now();
              
              // Process in batches of 3, but commit after each batch
              const BATCH_SIZE = 3; // Process 3 presets at a time
              const REQUEST_TIMEOUT = 20 * 60 * 1000; // 20 minutes per request
              const MAX_RETRIES = 3; // Retry up to 3 times
              
              // Track all results across batches
              const allResults = [];
              
              // Helper function to update PR description
              async function updatePRDescription(successCount, totalCount, results) {
                try {
                  let prBody = `This PR was automatically generated from issue #${issueNumber}\n\n`;
                  prBody += `## 🚀 Generation Progress\n\n`;
                  prBody += `**Status:** ${successCount}/${totalCount} presets generated\n\n`;
                  
                  if (successCount > 0) {
                    prBody += `### ✅ Completed Presets\n\n`;
                    results.filter(r => r.success).forEach((r, idx) => {
                      prBody += `${idx + 1}. **${r.metadata?.title || r.presetId}**\n`;
                      prBody += `   - File: \`${r.filepath}\`\n`;
                      if (r.retries > 0) {
                        prBody += `   - 🔄 Succeeded after ${r.retries} ${r.retries === 1 ? 'retry' : 'retries'}\n`;
                      }
                    });
                    prBody += `\n`;
                  }
                  
                  const failedCount = results.filter(r => !r.success).length;
                  if (failedCount > 0) {
                    prBody += `### ❌ Failed Presets (${failedCount})\n\n`;
                    results.filter(r => !r.success).forEach((r, idx) => {
                      prBody += `${idx + 1}. **Preset ${r.index}** - ${r.error}\n`;
                    });
                    prBody += `\n`;
                  }
                  
                  if (successCount < totalCount) {
                    prBody += `_Generation in progress... This description will be updated as more presets complete._\n\n`;
                  }
                  
                  prBody += `Closes #${issueNumber}`;
                  
                  await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${prNumber}`, {
                    method: 'PATCH',
                    headers: {
                      'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                      'Content-Type': 'application/json',
                      'Accept': 'application/vnd.github.v3+json',
                    },
                    body: JSON.stringify({ body: prBody }),
                  });
                  
                  console.log(`✅ Updated PR description: ${successCount}/${totalCount} complete`);
                } catch (error) {
                  console.warn(`⚠️  Failed to update PR description:`, error.message);
                }
              }
              
              // Create API call function with timeout, retry logic, and immediate commit
              async function callPresetAPI(request, index, retryCount = 0) {
                if (!request.prompt || !request.technicalSpecs) {
                  console.error(`❌ Preset ${index} missing required fields (prompt, technicalSpecs)`);
                  return { index, success: false, error: 'Missing required fields' };
                }

                try {
                  const combinedPrompt = `${request.prompt}\n\nTechnical Specifications:\n${request.technicalSpecs}`;
                  
                  const retryInfo = retryCount > 0 ? ` (Retry ${retryCount}/${MAX_RETRIES})` : '';
                  console.log(`📤 [${index}/${presetRequests.length}] Calling API...${retryInfo}`);
                  console.log(`   URL: ${apiBaseUrl}/api/studio/chat/dev/agent/preset/generate`);
                  console.log(`   Method: POST`);
                  console.log(`   Auth: Bearer ${devApiKey ? devApiKey.substring(0, 10) + '...' : 'MISSING'}`);
                  console.log(`   Prompt length: ${combinedPrompt.length} characters`);
                  
                  // Create AbortController for timeout
                  const controller = new AbortController();
                  const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
                  
                  let result;
                  try {
                    const response = await fetch(`${apiBaseUrl}/api/studio/chat/dev/agent/preset/generate`, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${devApiKey}`,
                      },
                      body: JSON.stringify({
                        prompt: combinedPrompt,
                      }),
                      signal: controller.signal,
                    });
                    
                    clearTimeout(timeoutId);

                    console.log(`📥 [${index}/${presetRequests.length}] Response status: ${response.status} ${response.statusText}`);
                    console.log(`   Response headers:`, JSON.stringify(Object.fromEntries(response.headers.entries())));

                    if (!response.ok) {
                      const errorText = await response.text();
                      console.error(`❌ [${index}/${presetRequests.length}] Error response body:`, errorText || '(empty)');
                      console.error(`   Response headers:`, JSON.stringify(Object.fromEntries(response.headers.entries())));
                      throw new Error(`API returned ${response.status}: ${errorText || '(empty response body)'}`);
                    }

                    result = await response.json();
                    console.log(`✅ [${index}/${presetRequests.length}] API call successful`);
                  } catch (fetchError) {
                    clearTimeout(timeoutId);
                    if (fetchError.name === 'AbortError') {
                      throw new Error(`Request timed out after ${REQUEST_TIMEOUT / 1000 / 60} minutes`);
                    }
                    throw fetchError;
                  }

                    // Parse the nested response structure
                    // Response format: [{ parts: [{ output: { code, metadata } }] }]
                    let generatedCode, metadata, savedFilePath;
                    
                    if (Array.isArray(result) && result.length > 0) {
                      // Nested structure from AI Router
                      const firstItem = result[0];
                      if (firstItem.parts && Array.isArray(firstItem.parts) && firstItem.parts.length > 0) {
                        const output = firstItem.parts[0].output;
                        generatedCode = output?.code;
                        metadata = output?.metadata;
                        
                        // Extract relative path from absolute Windows path
                        // Format: "V:\\...\\apps\\mediamake\\components\\..."
                        // We need: "components\\..."
                        if (metadata?.filePath) {
                          const absolutePath = metadata.filePath;
                          // Find the part after "apps/mediamake" or "apps\\mediamake"
                          const appsMediamakeIndex = absolutePath.indexOf('apps\\mediamake\\');
                          if (appsMediamakeIndex !== -1) {
                            savedFilePath = absolutePath.substring(appsMediamakeIndex + 'apps\\mediamake\\'.length);
                          } else {
                            // Try forward slash
                            const appsMediamakeIndexForward = absolutePath.indexOf('apps/mediamake/');
                            if (appsMediamakeIndexForward !== -1) {
                              savedFilePath = absolutePath.substring(appsMediamakeIndexForward + 'apps/mediamake/'.length);
                            } else {
                              savedFilePath = metadata.filePath;
                            }
                          }
                          // Normalize to forward slashes
                          savedFilePath = savedFilePath.replace(/\\/g, '/');
                        }
                      }
                    } else {
                      // Simple structure (fallback)
                      generatedCode = result.code || result.data?.code;
                      metadata = result.metadata || result.data?.metadata;
                      
                      // Extract path from metadata
                      if (metadata?.filePath) {
                        const fullPath = metadata.filePath;
                        // Extract path after 'apps/mediamake/'
                        const appsMediamakeIndex = fullPath.indexOf('apps/mediamake/');
                        if (appsMediamakeIndex !== -1) {
                          savedFilePath = fullPath.substring(appsMediamakeIndex + 'apps/mediamake/'.length);
                        } else {
                          savedFilePath = fullPath;
                        }
                      }
                    }
                    
                    if (!generatedCode) {
                      throw new Error('API response missing code field');
                    }
                    
                    if (!savedFilePath) {
                      throw new Error('API response missing filePath in metadata');
                    }
                    
                    console.log(`📁 File path extracted: ${savedFilePath}`);
                    console.log(`   Raw metadata.filePath: ${metadata?.filePath}`);

                    // Extract lint/validation info if present
                    const lintOutput = metadata?.lintOutput || '';
                    const validationWarnings = metadata?.validationWarnings || [];
                    const validationErrors = metadata?.validationErrors || [];
                    const validationFailed = metadata?.validationFailed || false;
                    const wasAutoFixed = metadata?.wasAutoFixed || false;
                    const hasLintIssues = lintOutput && (lintOutput.includes('error') || lintOutput.includes('warning'));
                    
                    const presetId = metadata?.id || `preset-${timestamp}-${index}`;
                    const presetTitle = metadata?.title || presetId;
                    
                    // ==========================================
                    // IMMEDIATE COMMIT - Right after generation!
                    // ==========================================
                    console.log(`💾 [${index}/${presetRequests.length}] Committing preset immediately...`);
                    
                    try {
                      // Determine correct file path
                      let relativeFilePath = savedFilePath;
                      if (!relativeFilePath.startsWith('apps/mediamake/')) {
                        relativeFilePath = `apps/mediamake/${relativeFilePath}`;
                      }
                      
                      console.log(`   📁 Adding file: ${relativeFilePath}`);
                      
                      // Check if file exists and add it
                      if (fs.existsSync(relativeFilePath)) {
                        execSync(`git add "${relativeFilePath}"`);
                      } else {
                        // Try alternate path
                        const alternatePath = savedFilePath;
                        if (fs.existsSync(alternatePath)) {
                          console.log(`   ✅ Found at alternate path: ${alternatePath}`);
                          execSync(`git add "${alternatePath}"`);
                          relativeFilePath = alternatePath;
                        } else {
                          throw new Error(`File not found: ${relativeFilePath} or ${alternatePath}`);
                        }
                      }
                      
                      // Create commit message
                      let commitMsg = `feat: add ${presetTitle}`;
                      if (validationFailed) {
                        commitMsg += ' (validation failed - needs review)';
                      } else if (wasAutoFixed) {
                        commitMsg += ' (auto-fixed)';
                      }
                      if (retryCount > 0) {
                        commitMsg += `\n\nSucceeded after ${retryCount} ${retryCount === 1 ? 'retry' : 'retries'}`;
                      }
                      commitMsg += `\n\nGenerated from issue #${issueNumber}`;
                      
                      // Commit
                      execSync(`git commit -m "${commitMsg}"`);
                      console.log(`   ✅ [${index}/${presetRequests.length}] Committed: ${presetTitle}`);
                      
                      // Push immediately to save progress
                      execSync(`git push origin ${branchName}`);
                      console.log(`   🚀 [${index}/${presetRequests.length}] Pushed - progress saved!`);
                      
                      // Update PR description after each commit
                      allResults.push({
                        index,
                        success: true,
                        presetId,
                        filepath: savedFilePath,
                        metadata,
                        validationFailed,
                        wasAutoFixed,
                        hasLintIssues,
                        retries: retryCount,
                        originalRequest: request,
                      });
                      
                      const totalSuccessful = allResults.filter(r => r.success).length;
                      await updatePRDescription(totalSuccessful, presetRequests.length, allResults);
                      
                    } catch (gitError) {
                      console.error(`   ❌ [${index}/${presetRequests.length}] Git commit/push failed:`, gitError.message);
                      console.error(`   ⚠️  Preset was generated but not committed. Continuing...`);
                      // Don't fail the whole process, just log it
                    }
                    
                    return {
                      index,
                      success: true,
                      generatedCode,
                      metadata,
                      savedFilePath,
                      presetId,
                      filepath: savedFilePath,
                      originalRequest: request,
                      lintOutput,
                      validationWarnings,
                      validationErrors,
                      validationFailed,
                      hasLintIssues,
                      wasAutoFixed,
                      retries: retryCount,
                    };
                  } catch (error) {
                    console.error(`❌ [${index}/${presetRequests.length}] API call failed:`, error.message);
                    console.error(`   Error stack:`, error.stack);
                    
                    // Check if error is retryable
                    const isRetryableError = 
                      error.message.includes('fetch failed') ||
                      error.message.includes('timed out') ||
                      error.message.includes('ECONNRESET') ||
                      error.message.includes('ETIMEDOUT') ||
                      error.message.includes('ENOTFOUND') ||
                      error.message.includes('socket hang up');
                    
                    if (error.message.includes('fetch failed')) {
                      console.error(`   ℹ️  This is likely a timeout or connection issue`);
                    } else if (error.message.includes('timed out')) {
                      console.error(`   ℹ️  Request exceeded ${REQUEST_TIMEOUT / 1000 / 60} minute timeout`);
                    }
                    
                    // Retry if possible
                    if (isRetryableError && retryCount < MAX_RETRIES) {
                      const waitTime = Math.pow(2, retryCount) * 5000; // Exponential backoff: 5s, 10s, 20s
                      console.log(`🔄 Retrying in ${waitTime / 1000} seconds... (Attempt ${retryCount + 1}/${MAX_RETRIES})`);
                      
                      await new Promise(resolve => setTimeout(resolve, waitTime));
                      
                      // Recursive retry
                      return callPresetAPI(request, index, retryCount + 1);
                    }
                    
                    // Max retries exceeded or non-retryable error
                    if (retryCount >= MAX_RETRIES) {
                      console.error(`   ❌ Max retries (${MAX_RETRIES}) exceeded`);
                    }
                    
                    return {
                      index,
                      success: false,
                      error: error.message,
                      errorStack: error.stack,
                      retries: retryCount,
                    };
                  }
              }

              // Process requests in batches (3 at a time), each commits immediately upon completion
              for (let i = 0; i < presetRequests.length; i += BATCH_SIZE) {
                const batch = presetRequests.slice(i, i + BATCH_SIZE);
                const batchNumber = Math.floor(i / BATCH_SIZE) + 1;
                const totalBatches = Math.ceil(presetRequests.length / BATCH_SIZE);
                
                console.log(`\n📦 Processing batch ${batchNumber}/${totalBatches} (${batch.length} presets)...`);
                console.log(`   Note: Each preset will commit & push immediately upon completion`);
                
                const batchPromises = batch.map((request, batchIndex) => {
                  const index = i + batchIndex + 1;
                  return callPresetAPI(request, index);
                });
                
                // Process all 3 in parallel, each will commit independently as it completes
                const batchResults = await Promise.all(batchPromises);
                
                const batchSuccesses = batchResults.filter(r => r.success);
                const batchFailures = batchResults.filter(r => !r.success);
                
                console.log(`\n✅ Batch ${batchNumber} complete: ${batchSuccesses.length}/${batch.length} successful`);
                
                // Track failures (successes already tracked in callPresetAPI)
                batchFailures.forEach(failure => {
                  allResults.push(failure);
                });
                
                // Small delay between batches to avoid overwhelming the server
                if (i + BATCH_SIZE < presetRequests.length) {
                  console.log(`⏳ Waiting 5 seconds before next batch...`);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
              
              const successfulPresets = allResults.filter(r => r.success);
              const failedPresets = allResults.filter(r => !r.success);
              
              const step2Duration = ((Date.now() - step2Start) / 1000).toFixed(2);
              console.log(`\n📊 All presets processed!`);
              console.log(`📊 Results: ${successfulPresets.length} successful, ${failedPresets.length} failed (${step2Duration}s)`);
              
              // If there were failures, check server logs
              if (failedPresets.length > 0) {
                console.log('\n📋 Checking server logs for errors...');
                try {
                  const serverLog = fs.readFileSync('server.log', 'utf8');
                  const lines = serverLog.split('\n');
                  const lastLines = lines.slice(-100).join('\n');
                  console.log(`Server log (last 100 of ${lines.length} lines):`);
                  console.log('-----------------------------------');
                  console.log(lastLines);
                  console.log('-----------------------------------');
                } catch (e) {
                  console.warn('⚠️  Could not read server log:', e.message);
                }
              }

              // ==========================================
              // STEP 3: FINAL PR UPDATE
              // ==========================================
              console.log('\n📝 Step 3: Finalizing Pull Request...');
              const step3Start = Date.now();
              
              if (prNumber) {
                try {
                  console.log(`📝 Updating PR #${prNumber} with final results...`);
                  
                  // Build comprehensive final PR body
                  let prBody = `This PR was automatically generated from issue #${issueNumber}\n\n`;
                  
                  // Add generation complete status
                  prBody += `## ✅ Generation Complete\n\n`;
                  prBody += `**Final Status:** ${successfulPresets.length}/${presetRequests.length} presets successfully generated\n\n`;
                  
                  if (failedPresets.length > 0) {
                    prBody += `⚠️ ${failedPresets.length} preset(s) failed - see details below\n\n`;
                  }
                  
                  // Check if any presets were auto-fixed, have validation failures, or have lint issues
                  const presetsAutoFixed = allResults.filter(r => r.success && r.wasAutoFixed);
                  const presetsWithValidationFailures = allResults.filter(r => r.success && r.validationFailed);
                  const presetsWithLintIssues = allResults.filter(r => r.success && r.hasLintIssues && !r.validationFailed);
                  const presetsWithRetries = allResults.filter(r => r.success && r.retries && r.retries > 0);
                  
                  if (presetsWithValidationFailures.length > 0) {
                    prBody += `## 🔴 Validation Failed\n\n`;
                    prBody += `⚠️ **${presetsWithValidationFailures.length} preset(s) failed validation after 3 attempts but were saved for review:**\n`;
                    presetsWithValidationFailures.forEach(r => {
                      prBody += `- **${r.metadata?.title || r.presetId}** - ⚠️ **Requires manual fixes**\n`;
                      if (r.validationErrors && r.validationErrors.length > 0) {
                        prBody += `  - Errors: ${r.validationErrors[0]}\n`;
                      }
                    });
                    prBody += `\n_❗ These presets have validation errors and should be reviewed and fixed before merging._\n\n`;
                  }
                  
                  if (presetsAutoFixed.length > 0) {
                    prBody += `## ✨ Auto-Fixed Presets\n\n`;
                    prBody += `${presetsAutoFixed.length} preset(s) were automatically fixed by ESLint:\n`;
                    presetsAutoFixed.forEach(r => {
                      prBody += `- **${r.metadata?.title || r.presetId}** ✅\n`;
                    });
                    prBody += `\n`;
                  }
                  
                  if (presetsWithLintIssues.length > 0) {
                    prBody += `## ⚠️ Lint Check Notice\n\n`;
                    prBody += `${presetsWithLintIssues.length} preset(s) have lint warnings that may need attention:\n`;
                    presetsWithLintIssues.forEach(r => {
                      prBody += `- **${r.metadata?.title || r.presetId}** - Check details below\n`;
                    });
                    prBody += `\n_These are informational warnings. ESLint auto-fix was attempted. Please review before merging._\n\n`;
                  }
                  
                  if (presetsWithRetries.length > 0) {
                    prBody += `## 🔄 Retry Information\n\n`;
                    prBody += `${presetsWithRetries.length} preset(s) required retries due to temporary connection issues:\n`;
                    presetsWithRetries.forEach(r => {
                      prBody += `- **${r.metadata?.title || r.presetId}** - Succeeded after ${r.retries} ${r.retries === 1 ? 'retry' : 'retries'}\n`;
                    });
                    prBody += `\n_These presets were successfully generated after automatic retry._\n\n`;
                  }
                  
                  prBody += `## 📦 Generated Presets (${successfulPresets.length})\n\n`;
                  
                  allResults.filter(r => r.success).forEach((result, idx) => {
                    prBody += `### ${idx + 1}. ${result.metadata?.title || result.presetId}\n\n`;
                    prBody += `**ID:** \`${result.presetId}\`\n`;
                    prBody += `**Description:** ${result.metadata?.description || 'N/A'}\n`;
                    prBody += `**File:** \`${result.filepath}\`\n`;
                    
                    // Show validation failure status
                    if (result.validationFailed) {
                      prBody += `**Status:** 🔴 **Validation Failed - Requires Manual Fixes**\n`;
                    } else if (result.wasAutoFixed) {
                      prBody += `**Status:** ✨ Auto-fixed by ESLint\n`;
                    } else {
                      prBody += `**Status:** ✅ Validated\n`;
                    }
                    prBody += `\n`;
                    
                    // Add validation errors if present
                    if (result.validationFailed && result.validationErrors && result.validationErrors.length > 0) {
                      prBody += `**❌ Validation Errors (after 3 attempts):**\n`;
                      result.validationErrors.slice(0, 3).forEach(error => {
                        prBody += `- ${error}\n`;
                      });
                      if (result.validationErrors.length > 3) {
                        prBody += `- ... and ${result.validationErrors.length - 3} more error(s)\n`;
                      }
                      prBody += `\n`;
                    }
                    
                    // Add lint/validation warnings
                    if (result.validationWarnings && result.validationWarnings.length > 0) {
                      prBody += `**⚠️ Validation Warnings:**\n`;
                      result.validationWarnings.forEach(warning => {
                        prBody += `- ${warning}\n`;
                      });
                      prBody += `\n`;
                    }
                    
                    // Add lint output if there are issues
                    if (result.hasLintIssues && result.lintOutput) {
                      prBody += `<details>\n<summary>🔍 Lint Check Results (click to expand)</summary>\n\n`;
                      prBody += `\`\`\`\n${result.lintOutput.substring(0, 2000)}\n\`\`\`\n\n`;
                      if (result.lintOutput.length > 2000) {
                        prBody += `_(Output truncated - see full output in workflow logs)_\n\n`;
                      }
                      prBody += `</details>\n\n`;
                    }
                    
                    // Add truncated prompt
                    const prompt = result.originalRequest.prompt;
                    if (prompt) {
                      const truncatedPrompt = prompt.length > 200 
                        ? prompt.substring(0, 200) + '...' 
                        : prompt;
                      prBody += `**Original Prompt:** ${truncatedPrompt}\n\n`;
                    }
                    
                    prBody += `---\n\n`;
                  });
                  
                  if (failedPresets.length > 0) {
                    prBody += `\n## ❌ Failed Presets (${failedPresets.length})\n\n`;
                    failedPresets.forEach((r, idx) => {
                      prBody += `${idx + 1}. **Preset ${r.index}** - ${r.error}\n`;
                      if (r.retries > 0) {
                        prBody += `   - Failed after ${r.retries} ${r.retries === 1 ? 'retry' : 'retries'}\n`;
                      }
                    });
                    prBody += `\n`;
                  }
                  
                  prBody += `\nCloses #${issueNumber}`;

                  console.log(`📝 Updating PR #${prNumber} with final results...`);
                  
                  const prResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${prNumber}`, {
                    method: 'PATCH',
                    headers: {
                      'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                      'Content-Type': 'application/json',
                      'Accept': 'application/vnd.github.v3+json',
                    },
                    body: JSON.stringify({
                      body: prBody,
                    }),
                  });

                  if (!prResponse.ok) {
                    const prError = await prResponse.text();
                    throw new Error(`Failed to update PR: ${prResponse.status} ${prError}`);
                  }
                  
                  console.log(`✅ PR #${prNumber} updated with final results: ${prUrl}`);

                } catch (error) {
                  console.error(`❌ Failed to update PR:`, error.message);
                }
              } else {
                console.log('⏭️  Skipping PR update (no PR was created)');
              }
              
              const step3Duration = ((Date.now() - step3Start) / 1000).toFixed(2);
              console.log(`\n✅ PR update complete (${step3Duration}s)`);

              // ==========================================
              // STEP 4: SUMMARY & REPORTING
              // ==========================================
              console.log('\n📊 Step 4: Creating summary comment on issue...');
              
              const successCount = successfulPresets.length;
              const failureCount = failedPresets.length;
              
              let commentBody = `## 🤖 Preset Generation Complete\n\n`;
              commentBody += `**Total Requests:** ${presetRequests.length}\n`;
              commentBody += `**Successful:** ${successCount} ✅\n`;
              commentBody += `**Failed:** ${failureCount} ❌\n\n`;
              
              if (successCount > 0 && prUrl) {
                commentBody += `### ✅ Successfully Generated\n\n`;
                commentBody += `**Pull Request:** [#${prNumber}](${prUrl})\n\n`;
                commentBody += `All ${successCount} preset(s) have been committed and pushed. Each preset was committed immediately after generation to preserve progress.\n\n`;
                commentBody += `**Presets included:**\n`;
                allResults.filter(r => r.success).forEach(r => {
                  commentBody += `- **${r.metadata?.title || r.presetId}**`;
                  if (r.retries > 0) {
                    commentBody += ` 🔄 (succeeded after ${r.retries} ${r.retries === 1 ? 'retry' : 'retries'})`;
                  }
                  commentBody += `\n`;
                  commentBody += `  - File: \`${r.filepath}\`\n`;
                });
              } else if (successCount > 0 && !prUrl) {
                commentBody += `### ⚠️ Partially Successful\n\n`;
                commentBody += `${successCount} preset(s) were generated but PR update failed.\n\n`;
                allResults.filter(r => r.success).forEach(r => {
                  commentBody += `- **${r.metadata?.title || r.presetId}**\n`;
                });
              }
              
              if (failureCount > 0) {
                commentBody += `\n### ❌ Failed Presets\n\n`;
                allResults.filter(r => !r.success).forEach(r => {
                  commentBody += `- **Preset ${r.index}** - ${r.error}`;
                  if (r.retries > 0) {
                    commentBody += ` (failed after ${r.retries} ${r.retries === 1 ? 'retry' : 'retries'})`;
                  }
                  commentBody += `\n`;
                });
              }

              // Post comment to issue
              await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${issueNumber}/comments`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Accept': 'application/vnd.github.v3+json',
                },
                body: JSON.stringify({ body: commentBody }),
              });

              const totalDuration = ((Date.now() - startTime) / 1000).toFixed(2);
              
              console.log('\n✨ All done!');
              console.log(`\n📊 Final Results:`);
              console.log(`   Total: ${presetRequests.length}`);
              console.log(`   ✅ Successful: ${successCount}`);
              console.log(`   ❌ Failed: ${failureCount}`);
              if (prUrl) {
                console.log(`   🔗 PR: ${prUrl}`);
              }
              console.log(`\n⏱️  Timing:`);
              console.log(`   Step 1 (Branch & PR creation): ${step1Duration}s`);
              console.log(`   Step 2 (Preset generation with commits): ${step2Duration}s`);
              console.log(`   Step 3 (Final PR update): ${step3Duration}s`);
              console.log(`   Total: ${totalDuration}s`);
              console.log(`\n💾 Progress Preservation:`);
              console.log(`   Each preset was committed immediately after generation`);
              console.log(`   If workflow times out, all completed presets are saved`);
              
              // Exit with error only if ALL presets failed or no PR was created
              if (failureCount > 0 && successCount === 0) {
                console.log(`\n❌ All presets failed. Exiting with error.`);
                process.exit(1);
              } else if (failureCount > 0) {
                console.log(`\n⚠️  ${failureCount} preset(s) failed, but ${successCount} succeeded.`);
                console.log(`   The workflow will continue with the successful presets.`);
                // Don't exit with error - partial success is acceptable
              }

            } catch (error) {
              console.error('❌ Fatal error:', error);
              process.exit(1);
            }
          }

          processPresets();
          EOF

      - name: Stop MediaMake Server
        if: always()
        run: |
          echo "🛑 Stopping server..."
          pkill -f "next start" || true
          echo "✅ Server stopped"

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Failed to process preset generation requests. Please check the workflow logs for details.'
            });

