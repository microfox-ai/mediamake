name: Generate Presets from Issue

on:
  issues:
    types: [opened]

jobs:
  process-preset-requests:
    # Only run if issue title starts with "New Presets" (case variations)
    if: |
      startsWith(github.event.issue.title, 'New Presets') ||
      startsWith(github.event.issue.title, 'new presets') ||
      startsWith(github.event.issue.title, 'NEW PRESETS') ||
      startsWith(github.event.issue.title, 'New presets') ||
      startsWith(github.event.issue.title, 'new Presets')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Generate presets using standalone script
        id: process
        working-directory: apps/mediamake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npx tsx scripts/github-workflow-preset-generator.ts

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Failed to process preset generation requests. Please check the workflow logs for details.'
            });
