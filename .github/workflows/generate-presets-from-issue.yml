name: Generate Presets from Issue

on:
  issues:
    types: [opened]

jobs:
  process-preset-requests:
    # Only run if issue title contains "new presets" or "New Presets" (case variations)
    if: |
      contains(github.event.issue.title, 'New Presets') ||
      contains(github.event.issue.title, 'new presets') ||
      contains(github.event.issue.title, 'NEW PRESETS') ||
      contains(github.event.issue.title, 'New presets') ||
      contains(github.event.issue.title, 'new Presets')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # working-directory: apps/mediamake
        run: npm i

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Variables
        working-directory: apps/mediamake
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel env pull --environment=production --token=${{ secrets.VERCEL_TOKEN }} .env
          echo "✅ Environment variables pulled"

      - name: Build MediaMake App
        # working-directory: apps/mediamake
        run: |
          npm run build
          echo "✅ Build complete"

      - name: Start MediaMake Server
        working-directory: apps/mediamake
        run: |
          npm run start &
          echo "🚀 Server starting in background..."
          
          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Server is ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          echo "❌ Server failed to start within 2 minutes"
          exit 1

      - name: Parse and process preset requests
        id: process
        working-directory: apps/mediamake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: http://localhost:3000
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          async function processPresets() {
            try {
              const issueBody = process.env.ISSUE_BODY;
              const issueNumber = process.env.ISSUE_NUMBER;
              const issueTitle = process.env.ISSUE_TITLE;
              const apiBaseUrl = process.env.API_BASE_URL;
              
              // Validate issue title (case-insensitive)
              if (!issueTitle || !issueTitle.toLowerCase().includes('new presets')) {
                console.log('⏭️  Skipping: Issue title does not contain "new presets" (case-insensitive)');
                process.exit(0);
              }
              
              console.log('✅ Issue title validated');
              console.log('📋 Parsing issue body as JSON...');
              
              // Parse the issue body - need to extract JSON from GitHub's markdown formatting
              let presetRequests;
              try {
                let jsonString = issueBody.trim();
                console.log('📄 Raw issue body preview:', jsonString.substring(0, 150).replace(/\n/g, ' ') + '...');
                console.log('📏 Body length:', jsonString.length, 'characters');
                
                // GitHub issue templates wrap content with markdown headers
                // Extract just the JSON array part
                // Look for the first '[' and last ']' to extract the JSON array
                const firstBracket = jsonString.indexOf('[');
                const lastBracket = jsonString.lastIndexOf(']');
                
                if (firstBracket === -1 || lastBracket === -1 || firstBracket >= lastBracket) {
                  throw new Error('Could not find JSON array in issue body (missing [ or ])');
                }
                
                // Extract the JSON portion
                jsonString = jsonString.substring(firstBracket, lastBracket + 1);
                console.log('📄 Extracted JSON preview:', jsonString.substring(0, 150).replace(/\n/g, ' ') + '...');
                
                presetRequests = JSON.parse(jsonString);
                
                if (!Array.isArray(presetRequests)) {
                  console.error('❌ Parsed content is not a JSON array');
                  console.error('Received type:', typeof presetRequests);
                  process.exit(1);
                }
                
                console.log('✅ Successfully parsed', presetRequests.length, 'preset request(s)');
              } catch (error) {
                console.error('❌ Failed to parse issue body as JSON:', error.message);
                console.error('Issue body preview:', issueBody.substring(0, 300));
                console.error('');
                console.error('💡 Tip: Make sure your issue contains a valid JSON array.');
                console.error('   Format: [{"prompt": "...", "technicalSpecs": "..."}]');
                console.error('   Validate at: https://jsonlint.com');
                process.exit(1);
              }

              if (!Array.isArray(presetRequests)) {
                console.error('❌ Issue body is not an array');
                process.exit(1);
              }

              console.log(`✅ Found ${presetRequests.length} preset request(s)`);

              // Configure git
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

              // Start timing
              const startTime = Date.now();

              // ==========================================
              // STEP 1: PARALLEL API CALLS
              // ==========================================
              console.log('\n🚀 Step 1: Fetching all presets in parallel...');
              const step1Start = Date.now();
              
              // Create promises for all API calls
              const apiPromises = presetRequests.map((request, i) => {
                return (async () => {
                  const index = i + 1;
                  
                  if (!request.prompt || !request.technicalSpecs) {
                    console.error(`❌ Preset ${index} missing required fields (prompt, technicalSpecs)`);
                    return { index, success: false, error: 'Missing required fields' };
                  }

                  try {
                    const combinedPrompt = `${request.prompt}\n\nTechnical Specifications:\n${request.technicalSpecs}`;
                    
                    console.log(`📤 [${index}/${presetRequests.length}] Calling API...`);
                    
                    const response = await fetch(`${apiBaseUrl}/api/studio/chat/agent/preset/generate`, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                      },
                      body: JSON.stringify({
                        prompt: combinedPrompt,
                      }),
                    });

                    if (!response.ok) {
                      const errorText = await response.text();
                      throw new Error(`API returned ${response.status}: ${errorText}`);
                    }

                    const result = await response.json();
                    console.log(`✅ [${index}/${presetRequests.length}] API call successful`);

                    // Parse the nested response structure
                    // Response format: [{ parts: [{ output: { code, metadata } }] }]
                    let generatedCode, metadata, savedFilePath;
                    
                    if (Array.isArray(result) && result.length > 0) {
                      // Nested structure from AI Router
                      const firstItem = result[0];
                      if (firstItem.parts && Array.isArray(firstItem.parts) && firstItem.parts.length > 0) {
                        const output = firstItem.parts[0].output;
                        generatedCode = output?.code;
                        metadata = output?.metadata;
                        
                        // Extract relative path from absolute Windows path
                        // Format: "V:\\...\\apps\\mediamake\\components\\..."
                        // We need: "components\\..."
                        if (metadata?.filePath) {
                          const absolutePath = metadata.filePath;
                          // Find the part after "apps/mediamake" or "apps\\mediamake"
                          const appsMediamakeIndex = absolutePath.indexOf('apps\\mediamake\\');
                          if (appsMediamakeIndex !== -1) {
                            savedFilePath = absolutePath.substring(appsMediamakeIndex + 'apps\\mediamake\\'.length);
                          } else {
                            // Try forward slash
                            const appsMediamakeIndexForward = absolutePath.indexOf('apps/mediamake/');
                            if (appsMediamakeIndexForward !== -1) {
                              savedFilePath = absolutePath.substring(appsMediamakeIndexForward + 'apps/mediamake/'.length);
                            } else {
                              savedFilePath = metadata.filePath;
                            }
                          }
                          // Normalize to forward slashes
                          savedFilePath = savedFilePath.replace(/\\/g, '/');
                        }
                      }
                    } else {
                      // Simple structure (fallback)
                      generatedCode = result.code || result.data?.code;
                      metadata = result.metadata || result.data?.metadata;
                      savedFilePath = metadata?.filePath;
                    }
                    
                    if (!generatedCode) {
                      throw new Error('API response missing code field');
                    }
                    
                    if (!savedFilePath) {
                      throw new Error('API response missing filePath in metadata');
                    }
                    
                    console.log(`📁 File path extracted: ${savedFilePath}`);

                    return {
                      index,
                      success: true,
                      generatedCode,
                      metadata,
                      savedFilePath,
                      originalRequest: request,
                    };
                  } catch (error) {
                    console.error(`❌ [${index}/${presetRequests.length}] API call failed:`, error.message);
                    return {
                      index,
                      success: false,
                      error: error.message,
                    };
                  }
                })();
              });

              // Wait for all API calls to complete
              const apiResults = await Promise.all(apiPromises);
              
              const successfulPresets = apiResults.filter(r => r.success);
              const failedPresets = apiResults.filter(r => !r.success);
              
              const step1Duration = ((Date.now() - step1Start) / 1000).toFixed(2);
              console.log(`\n📊 API Results: ${successfulPresets.length} successful, ${failedPresets.length} failed (${step1Duration}s)`);

              // ==========================================
              // STEP 2: SEQUENTIAL GIT OPERATIONS
              // ==========================================
              console.log('\n🌿 Step 2: Creating branches and committing files...');
              const step2Start = Date.now();

              const gitResults = [];
              
              for (const apiResult of apiResults) {
                if (!apiResult.success) {
                  gitResults.push(apiResult);
                  continue;
                }

                try {
                  const { index, savedFilePath, metadata, originalRequest } = apiResult;
                  const presetId = metadata?.id || `preset-${Date.now()}-${index}`;
                  const branchName = `preset/${presetId}-${Date.now()}`;
                  
                  console.log(`\n🎬 [${index}/${presetRequests.length}] Processing ${presetId}...`);
                  console.log(`📁 File already created by agent: ${savedFilePath}`);
                  console.log(`🌿 Creating branch: ${branchName}`);
                  
                  execSync(`git checkout -b ${branchName}`);

                  // File was already created by the agent, just commit it
                  // The savedFilePath is relative to apps/mediamake, we need it relative to repo root
                  const relativeFilePath = `apps/mediamake/${savedFilePath}`;
                  
                  console.log(`📝 Adding file to git: ${relativeFilePath}`);
                  execSync(`git add "${relativeFilePath}"`);
                  
                  const commitMessage = `feat: add ${presetId} preset from issue #${issueNumber}`;
                  execSync(`git commit -m "${commitMessage}"`);

                  console.log(`📤 Pushing branch: ${branchName}`);
                  execSync(`git push -u origin ${branchName}`);

                  gitResults.push({
                    ...apiResult,
                    presetId,
                    branchName,
                    filepath: savedFilePath,
                  });

                  console.log(`✅ [${index}/${presetRequests.length}] Git operations complete`);

                  execSync('git checkout main');

                } catch (error) {
                  console.error(`❌ Git operations failed for preset ${apiResult.index}:`, error.message);
                  gitResults.push({
                    ...apiResult,
                    success: false,
                    error: error.message,
                  });
                  
                  try {
                    execSync('git checkout main');
                  } catch (e) {
                    console.error('Failed to switch back to main branch:', e.message);
                  }
                }
              }

              const step2Duration = ((Date.now() - step2Start) / 1000).toFixed(2);
              console.log(`\n✅ Git operations complete (${step2Duration}s)`);

              // ==========================================
              // STEP 3: PARALLEL PR CREATION
              // ==========================================
              console.log('\n📝 Step 3: Creating Pull Requests in parallel...');
              const step3Start = Date.now();
              
              const prPromises = gitResults
                .filter(r => r.success && r.branchName)
                .map(result => {
                  return (async () => {
                    try {
                      const { index, presetId, branchName, metadata, originalRequest } = result;
                      
                      const prTitle = `Add ${metadata?.title || presetId} preset`;
                      const prBody = `This PR was automatically generated from issue #${issueNumber}\n\n## Generated Preset\n\n**ID:** ${presetId}\n**Title:** ${metadata?.title || 'N/A'}\n**Description:** ${metadata?.description || 'N/A'}\n\n### Original Request\n\n**Prompt:** ${originalRequest.prompt.substring(0, 500)}...\n\nCloses #${issueNumber}`;

                      console.log(`📝 [${index}/${presetRequests.length}] Creating PR: ${prTitle}`);
                      
                      const prResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls`, {
                        method: 'POST',
                        headers: {
                          'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                          'Content-Type': 'application/json',
                          'Accept': 'application/vnd.github.v3+json',
                        },
                        body: JSON.stringify({
                          title: prTitle,
                          body: prBody,
                          head: branchName,
                          base: 'main',
                        }),
                      });

                      if (!prResponse.ok) {
                        const prError = await prResponse.text();
                        throw new Error(`Failed to create PR: ${prResponse.status} ${prError}`);
                      }

                      const prData = await prResponse.json();
                      console.log(`✅ [${index}/${presetRequests.length}] PR created: ${prData.html_url}`);

                      return {
                        ...result,
                        prUrl: prData.html_url,
                        prNumber: prData.number,
                      };
                    } catch (error) {
                      console.error(`❌ PR creation failed for preset ${result.index}:`, error.message);
                      return {
                        ...result,
                        success: false,
                        error: `PR creation failed: ${error.message}`,
                      };
                    }
                  })();
                });

              const prResults = await Promise.all(prPromises);
              
              const step3Duration = ((Date.now() - step3Start) / 1000).toFixed(2);
              console.log(`\n✅ PR creation complete (${step3Duration}s)`);
              
              // Combine results: failed presets from git + PR results
              const results = gitResults.map(gitResult => {
                if (!gitResult.success || !gitResult.branchName) {
                  return gitResult;
                }
                const prResult = prResults.find(pr => pr.index === gitResult.index);
                return prResult || gitResult;
              });

              // ==========================================
              // STEP 4: SUMMARY & REPORTING
              // ==========================================
              console.log('\n📊 Step 4: Creating summary comment...');
              
              const successCount = results.filter(r => r.success && r.prNumber).length;
              const failureCount = results.length - successCount;
              
              let commentBody = `## 🤖 Preset Generation Results\n\n`;
              commentBody += `**Total Requests:** ${results.length}\n`;
              commentBody += `**Successful:** ${successCount}\n`;
              commentBody += `**Failed:** ${failureCount}\n\n`;
              
              if (successCount > 0) {
                commentBody += `### ✅ Successfully Generated\n\n`;
                results.filter(r => r.success).forEach(r => {
                  commentBody += `- **Preset ${r.index}** (\`${r.presetId}\`) - PR #${r.prNumber}: ${r.prUrl}\n`;
                });
              }
              
              if (failureCount > 0) {
                commentBody += `\n### ❌ Failed\n\n`;
                results.filter(r => !r.success).forEach(r => {
                  commentBody += `- **Preset ${r.index}** - Error: ${r.error}\n`;
                });
              }

              // Post comment to issue
              await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${issueNumber}/comments`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Accept': 'application/vnd.github.v3+json',
                },
                body: JSON.stringify({ body: commentBody }),
              });

              const totalDuration = ((Date.now() - startTime) / 1000).toFixed(2);
              
              console.log('\n✨ All done!');
              console.log(`\n📊 Final Results:`);
              console.log(`   Total: ${results.length}`);
              console.log(`   ✅ Successful: ${successCount}`);
              console.log(`   ❌ Failed: ${failureCount}`);
              console.log(`\n⏱️  Timing:`);
              console.log(`   Step 1 (Parallel API calls): ${step1Duration}s`);
              console.log(`   Step 2 (Sequential Git ops): ${step2Duration}s`);
              console.log(`   Step 3 (Parallel PR creation): ${step3Duration}s`);
              console.log(`   Total: ${totalDuration}s`);
              
              // Exit with error if any preset failed
              if (failureCount > 0) {
                console.log(`\n⚠️  Some presets failed. Check the logs above for details.`);
                process.exit(1);
              }

            } catch (error) {
              console.error('❌ Fatal error:', error);
              process.exit(1);
            }
          }

          processPresets();
          EOF

      - name: Stop MediaMake Server
        if: always()
        run: |
          echo "🛑 Stopping server..."
          pkill -f "next start" || true
          echo "✅ Server stopped"

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Failed to process preset generation requests. Please check the workflow logs for details.'
            });

