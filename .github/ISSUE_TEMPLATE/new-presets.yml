name: 🎬 New Presets Request
description: Request automated generation of new MediaMake presets via AI
title: "New Presets"
labels: ["preset-generation", "automation"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Automated Preset Generation
        
        This form will trigger an automated workflow that generates preset code using AI.
        
        **How it works:**
        1. You fill in the preset details below
        2. Submit the issue
        3. GitHub Actions automatically generates the code
        4. A Pull Request is created for each preset
        5. You'll receive a comment with links to the PRs
        
        ---
  
  - type: textarea
    id: presets
    attributes:
      label: Preset Specifications
      description: |
        **⚠️ IMPORTANT:** Paste ONLY the JSON array below. Do not add any text before or after the JSON.
        
        Each preset must have:
        - `prompt`: A detailed description of what the preset should do
        - `technicalSpecs`: Technical implementation details
        
        **Required Format (must start with [ and end with ]):**
        ```json
        [
          {
            "prompt": "Your preset description here...",
            "technicalSpecs": "Technical implementation details here..."
          }
        ]
        ```
        
        **✅ Valid:** Starts with `[` and ends with `]`
        **❌ Invalid:** Adding text like "Here's my request: [...]" or "See below: [...]"
        
        See examples below or check `.github/PRESET_GENERATION_EXAMPLE.md` for more.
      placeholder: |
        [
          {
            "prompt": "Create a CINEMATIC DEPTH parallax preset that mimics professional video production depth-of-field effects. Think of how a dolly zoom creates dimensionality - implement multiple BaseLayout layers (5-7 layers) each moving at calculated speed ratios (furthest: 0.1x, mid-ground: 0.5x, foreground: 1x speed). Use transform: translateX/Y with varying speeds based on mouse position or time progression. Each layer should have subtle blur filters that increase with distance (backdrop-filter or filter blur). Add atmospheric perspective by reducing opacity and saturation on distant layers. Implement smooth easing curves (cubic-bezier) that mirror camera movement in film. Consider adding particle effects or floating elements between layers for additional depth cues. Use z-index stacking with proper will-change properties for GPU acceleration.",
            "technicalSpecs": "Structure: BaseLayout container with position:relative and overflow:hidden (Tailwind: 'relative overflow-hidden w-full h-full'). Create 5-7 child BaseLayout layers with position:absolute (Tailwind: 'absolute inset-0'). Use generic effects array with translateX/Y animations at different speeds per layer. Apply CSS filters via style prop: filter: blur(0-8px) based on depth, opacity: 0.4-1 for atmospheric perspective. Set will-change: transform on each layer. Use fitDurationTo: 'scene' for continuous animation. Implement AnimationRange effects with easing: 'ease-in-out' and different animation durations per layer (back: 20s, mid: 10s, front: 5s). Consider using repeatChildrenProps for generating multiple layer instances with incrementing blur/opacity values."
          }
        ]
      value: |
        [
          {
            "prompt": "",
            "technicalSpecs": ""
          }
        ]
    validations:
      required: true
  
  - type: markdown
    attributes:
      value: |
        ---
        
        ## 📝 Quick Examples
        
        <details>
        <summary>🎨 Simple Fade-In Animation</summary>
        
        ```json
        [
          {
            "prompt": "Create a simple fade-in text animation preset. The text should start invisible and gradually fade in over 1 second using opacity transitions. Use TextAtom component with smooth easing.",
            "technicalSpecs": "Use BaseLayout container with TextAtom child. Apply generic effect with opacity property: range from 0 to 1. Duration: 1 second. Easing: ease-in-out. Use Tailwind classes for base styling. Component should accept text content as a parameter."
          }
        ]
        ```
        
        </details>
        
        <details>
        <summary>🎬 Parallax Effect</summary>
        
        ```json
        [
          {
            "prompt": "Design a VERTICAL SCROLL PARALLAX preset inspired by modern editorial video transitions. Visualize how vertical wipes work in video editing - create layers that scroll upward at different speeds, simulating a camera crane shot. Implement at least 4 BaseLayout layers with ImageAtom or VideoAtom content. Use transform: translateY with staggered timing (background: -10%, midground: -20%, foreground: -40% over duration). Add Ken Burns effect on static images using scale transforms. Include gradient overlays for depth separation.",
            "technicalSpecs": "Use BaseLayout with Tailwind 'flex flex-col relative h-screen w-full overflow-hidden'. Child layers: BaseLayout with 'absolute inset-0 w-full h-full'. Implement ImageAtom/VideoAtom with fit: 'cover'. Apply generic effects: [{property: 'translateY', range: [{time: 0, value: '0%'}, {time: 1, value: '-40%'}]}] with different percentages per layer. Add scale effect for Ken Burns: [{property: 'scale', range: [{time: 0, value: 1}, {time: 1, value: 1.2}]}]. Use gradient overlays via BaseLayout with 'bg-gradient-to-b from-transparent to-black/20'."
          }
        ]
        ```
        
        </details>
        
        <details>
        <summary>🎵 Audio-Reactive Animation</summary>
        
        ```json
        [
          {
            "prompt": "Build a REACTIVE AUDIO PARALLAX preset that synchronizes layer movement with audio beats. Think of it as a music video effect where background layers pulse and shift with the rhythm. Implement 3-5 BaseLayout layers that respond to different frequency ranges (bass moves background, mids affect middle layer, treble drives foreground). Use waveform effects with audio analysis to create dynamic translateX/Y movements. Add color shifts that react to audio intensity.",
            "technicalSpecs": "Structure: BaseLayout container 'relative w-full h-full overflow-hidden'. Create 3-5 layers with different waveform effect configurations. Use AudioAtom for audio source, then apply waveform effects: {type: 'translate', audioProperty: 'bass', sensitivity: 2, threshold: 0.3} for background, 'mid' for middle, 'treble' for foreground. Implement beat detection via fetcher API call to analyze audio. Add color/brightness waveform effects: {type: 'brightness', audioProperty: 'intensity'}. Use internal effect presets for beat-zoom and beat-shake on specific layers."
          }
        ]
        ```
        
        </details>
        
        <details>
        <summary>✨ Typography Animation</summary>
        
        ```json
        [
          {
            "prompt": "Create a TYPOGRAPHY-DRIVEN PARALLAX where text layers move at different depths creating a kinetic typography effect. Think of title sequences in films where text floats in 3D space. Use TextAtom components with caption data, each word or line on different parallax layers. Implement word-by-word reveal with depth-based timing offsets. Add shadow layers that move opposite to text for depth illusion. Include blur effects that change based on text proximity.",
            "technicalSpecs": "Container: BaseLayout 'relative w-full h-full overflow-hidden'. Parse caption data to create individual TextAtom components per word/phrase. Each TextAtom wrapped in BaseLayout with different z-index and parallax speed. Apply translateZ via transform3d for true 3D depth. Use perspective: 1000px on container. Implement word timing from caption data with staggered reveals. Add text-shadow that shifts based on position. Use generic effects for movement: [{property: 'translateY', range: based on word.impact}]. Consider rotateY for 3D flips on keywords."
          }
        ]
        ```
        
        </details>
        
        ---
        
        ## 💡 Tips for Best Results
        
        ### In the `prompt` field:
        - 🎯 Be specific and detailed
        - 🎬 Reference video editing techniques or effects you want to mimic
        - 🏗️ Mention the components you want to use (BaseLayout, TextAtom, ImageAtom, etc.)
        - ⏱️ Describe timing, durations, and animation flow
        - 🎨 Specify visual style and aesthetics
        - 📱 Include use cases or scenarios
        
        ### In the `technicalSpecs` field:
        - 📐 Specify component structure and hierarchy
        - 🎨 List Tailwind classes for styling
        - ⚡ Define generic effects configuration (property, range, easing)
        - 🔧 Mention parameters that should be configurable
        - 🔗 List dependencies on other presets or internal effects
        - 🚀 Note performance considerations (GPU acceleration, will-change)
        
        ---
        
        ## 📚 Additional Resources
        
        - **Full Documentation:** `.github/PRESET_GENERATION_WORKFLOW.md`
        - **More Examples:** `.github/PRESET_GENERATION_EXAMPLE.md`
        - **Implementation Details:** `PRESET_WORKFLOW_IMPLEMENTATION.md`
        
        ---
        
        ## ⚠️ Important Notes
        
        - ✅ The issue title must be "New Presets" (this template sets it automatically)
        - ✅ The body must be valid JSON starting with `[` and ending with `]`
        - ✅ **Do not add any text before or after the JSON array**
        - ✅ Use a JSON validator like [jsonlint.com](https://jsonlint.com/) to check your JSON
        - ✅ Each preset must have both `prompt` and `technicalSpecs` fields
        - ✅ You can include multiple presets in the array
        - ✅ Each preset will get its own Pull Request
        - ✅ Results will be posted as a comment on this issue
        - ⏱️ Generation typically takes 2-5 minutes per preset
        
        ## 🚀 What Happens After Submission
        
        1. **Workflow Triggers** - GitHub Actions detects the issue
        2. **JSON Validation** - Checks that the input is valid
        3. **API Calls** - Sends each preset to the MediaMake AI generation API
        4. **Code Generation** - AI generates TypeScript preset files
        5. **File Creation** - Files are created in `apps/mediamake/components/editor/presets/registry/generated/`
        6. **Branch & Commit** - Each preset gets its own branch and commit
        7. **Pull Requests** - Individual PRs are created for review
        8. **Summary Comment** - Results are posted back to this issue
        
        **Expected timeline:** 2-5 minutes per preset
        
        ---
  
  - type: checkboxes
    id: validation
    attributes:
      label: Validation Checklist
      description: Please confirm you've validated your input
      options:
        - label: I've validated my JSON array is valid (use [jsonlint.com](https://jsonlint.com/) if needed)
          required: true
        - label: Each preset has both `prompt` and `technicalSpecs` fields
          required: true
        - label: I've read the examples and documentation
          required: false

