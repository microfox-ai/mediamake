name: 🎬 New Presets Request
description: Request automated generation of new MediaMake presets via AI
title: "New Presets"
labels: ["preset-generation", "automation"]
body:
  - type: textarea
    id: presets
    attributes:
      label: JSON Array (Required)
      description: |
        Paste your JSON array of preset requests below.
        Format: [{"prompt": "...", "technicalSpecs": "..."}]
        
        ⚠️ Do NOT add any text before or after the JSON array.
        ⚠️ Validate your JSON at https://jsonlint.com before submitting.
      placeholder: |
        [
          {
            "prompt": "Your detailed preset description...",
            "technicalSpecs": "Technical implementation details..."
          }
        ]
      value: |
        [
          {
            "prompt": "",
            "technicalSpecs": ""
          }
        ]
    validations:
      required: true

