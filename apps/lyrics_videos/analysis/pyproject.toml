[project]
name = "lyrics-videos-analysis"
version = "0.1.0"
description = "Audio + lyric analysis for apps/lyrics_videos (stems, beat grid, envelopes, onsets, CTC word alignment, QA plots)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "demucs>=4.0.1",
    "librosa>=0.10.2",
    "matplotlib>=3.9",
    "numba>=0.60",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12.1",
    "soxr>=0.4",
    "torch>=2.4",
    "torchaudio>=2.4",
    "mlx-whisper>=0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
